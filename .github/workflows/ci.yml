name: WarrantKit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install and 30-second demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install WarrantKit without test extras
        run: python -m pip install .

      - name: Run no-root demo
        run: warrantkit demo

  unit:
    name: Unit and adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install Git-only test dependency
        run: python -m pip install "interleave-test @ git+https://github.com/Therealdk8890/interleave-test.git@c610ec63406d5a5c0d9ba1a3c0342072ed473752"

      - name: Install ClaimProofKit test dependency
        run: python -m pip install "claimproofkit @ git+https://github.com/Therealdk8890/ClaimProofKitPython.git@10c3707c249a582c7850806aa3f9570bcf0d0238"

      - name: Install WarrantKit
        run: python -m pip install -e '.[test]'

      - name: Install DProvenanceKit proof test dependency
        run: python -m pip install 'dprovenancekit[crypto]==0.7.1'

      - name: Verify package metadata
        run: |
          python -c 'import importlib.metadata as m, pathlib, tomllib; expected=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert m.version("warrantkit") == expected'
      - name: Verify README release version
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          readme = pathlib.Path("README.md").read_text()
          assert f"Latest release: [`warrantkit {version}`]" in readme, (
              "README latest-release label does not match pyproject.toml"
          )
          assert f"warrantkit=={version}" in readme, (
              "README pinned install command does not match pyproject.toml"
          )
          PY

      - name: Verify portable evidence fixture
        run: python tools/verify_runtime_evidence.py tests/fixtures/runtime_pinned_evidence.json

      - name: Run OpenAI Agents adapter regression tests
        run: python -m pytest -q tests/test_openai_agents_integration.py

      - name: Run unit tests
        run: python -m pytest -q tests -m "not integration"

  crewai-adapter:
    name: CrewAI adapter regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install WarrantKit CrewAI integration
        run: python -m pip install -e '.[crewai]'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run CrewAI adapter regression tests
        run: python -m pytest -q tests/test_crewai_integration.py

  authority-boundary-demo:
    name: Framework authority boundary proof
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install WarrantKit with LangChain integration
        run: python -m pip install -e '.[langchain]'

      - name: Install pytest for focused integration tests
        run: python -m pip install pytest

      - name: Run public LangChain middleware factory tests
        run: python -m pytest -q tests/test_langchain_middleware_factory.py

      - name: Run deterministic authority boundary proof
        run: python tools/run_authority_boundary_demo.py

  host-integration:
    name: Linux cgroup-v2 workload proof
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install Git-only test dependency
        run: python -m pip install "interleave-test @ git+https://github.com/Therealdk8890/interleave-test.git@c610ec63406d5a5c0d9ba1a3c0342072ed473752"

      - name: Install ClaimProofKit test dependency
        run: python -m pip install "claimproofkit @ git+https://github.com/Therealdk8890/ClaimProofKitPython.git@10c3707c249a582c7850806aa3f9570bcf0d0238"

      - name: Install WarrantKit
        run: python -m pip install -e '.[test]'

      - name: Install DProvenanceKit attestation verifier
        run: python -m pip install 'dprovenancekit[crypto]==0.7.1'

      - name: Inspect cgroup environment
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          test -f /sys/fs/cgroup/cgroup.controllers
          id

      - name: Run real workload containment proof
        env:
          AGENT_CONTAIN_RUN_REAL_CGROUP: "1"
          WARRANTKIT_RUN_RUNTIME_INTEROP: "1"
          WARRANTKIT_REAL_KILL_ARTIFACT: ./real-kill-runtime-evidence.json
        run: |
          sudo env \
            "AGENT_CONTAIN_RUN_REAL_CGROUP=$AGENT_CONTAIN_RUN_REAL_CGROUP" \
            "WARRANTKIT_RUN_RUNTIME_INTEROP=$WARRANTKIT_RUN_RUNTIME_INTEROP" \
            "WARRANTKIT_REAL_KILL_ARTIFACT=$WARRANTKIT_REAL_KILL_ARTIFACT" \
            "$pythonLocation/bin/python" -m pytest -q tests/integration/test_real_cgroup_execution.py tests/test_runtime_pinned_interoperability.py

      - name: Generate isolated CI Ed25519 signing key
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          key = Ed25519PrivateKey.generate()
          secret_dir = Path(os.environ["RUNNER_TEMP"]) / "warrantkit-proof-secrets"
          secret_dir.mkdir(mode=0o700)
          os.chmod(secret_dir, 0o700)
          key_path = secret_dir / "incident-signing-key.pem"
          key_bytes = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          )
          descriptor = os.open(key_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as key_file:
              key_file.write(key_bytes)
          os.chmod(key_path, 0o600)
          public_key_b64 = base64.b64encode(
              key.public_key().public_bytes(
                  serialization.Encoding.Raw,
                  serialization.PublicFormat.Raw,
              )
          ).decode("ascii")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"WARRANTKIT_CI_TRUSTED_PUBLIC_KEY_B64={public_key_b64}\n")
              env.write(f"WARRANTKIT_INCIDENT_SIGNING_KEY_FILE={key_path}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Per-run incident-bundle trust anchor\n\n")
              summary.write("This Ed25519 public key was generated for this CI run and is supplied separately to the incident-bundle verifier. Use it only to verify the artifact from this exact run. It is ephemeral and does not identify a production operator or provide host attestation.\n\n")
              summary.write("Trusted public key (base64 raw Ed25519): `" + public_key_b64 + "`\n")
          PY

      - name: Provision isolated CI DPK signing key and trust pin
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          from dprovenancekit.attestation import (
              SoftwareTraceAttestationKey,
              key_id_for_public_key_x963,
          )

          key = SoftwareTraceAttestationKey()
          private_key_b64 = base64.b64encode(key.raw_representation).decode("ascii")
          public_key_b64 = base64.b64encode(key.public_key_x963_representation).decode("ascii")
          key_id = key_id_for_public_key_x963(key.public_key_x963_representation)
          secret_dir = Path(os.environ["RUNNER_TEMP"]) / "warrantkit-proof-secrets"
          private_key_path = secret_dir / "dpk-signing-key.b64"
          descriptor = os.open(private_key_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as private_key_file:
              private_key_file.write(private_key_b64)
          os.chmod(private_key_path, 0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"WARRANTKIT_DPK_SIGNING_KEY_FILE={private_key_path}\n")
              env.write(f"WARRANTKIT_DPK_TRUSTED_KEY_ID={key_id}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Per-run DProvenanceKit trust anchor\n\n")
              summary.write("This P-256 public key is provisioned to the verifier separately from the uploaded proof artifact. It is ephemeral and authenticates only this CI run's signing key.\n\n")
              summary.write("Trusted DPK key ID: `" + key_id + "`\n\n")
              summary.write("Trusted public key (base64 X9.63 P-256): `" + public_key_b64 + "`\n")
          PY

      - name: Run operator-facing real-kill evidence proof
        env:
          AGENT_CONTAIN_RUN_REAL_CGROUP: "1"
          WARRANTKIT_INCIDENT_SIGNING_KEY_ID: warrantkit-ci-test-key
        run: |
          sudo env \
            "AGENT_CONTAIN_RUN_REAL_CGROUP=$AGENT_CONTAIN_RUN_REAL_CGROUP" \
            "WARRANTKIT_INCIDENT_SIGNING_KEY_ID=$WARRANTKIT_INCIDENT_SIGNING_KEY_ID" \
            "WARRANTKIT_INCIDENT_SIGNING_KEY_FILE=$WARRANTKIT_INCIDENT_SIGNING_KEY_FILE" \
            "WARRANTKIT_CI_TRUSTED_PUBLIC_KEY_B64=$WARRANTKIT_CI_TRUSTED_PUBLIC_KEY_B64" \
            "WARRANTKIT_DPK_SIGNING_KEY_FILE=$WARRANTKIT_DPK_SIGNING_KEY_FILE" \
            "WARRANTKIT_DPK_TRUSTED_KEY_ID=$WARRANTKIT_DPK_TRUSTED_KEY_ID" \
            "$pythonLocation/bin/python" tools/run_real_kill_dpk_proof.py --output-dir ./real-kill-dpk-proof

      - name: Re-verify exported real-kill artifact
        run: |
          python tools/verify_runtime_evidence.py ./real-kill-dpk-proof/runtime-evidence.json
          dpk attest verify --in ./real-kill-dpk-proof/dpk-attestation.json --trusted-key "$WARRANTKIT_DPK_TRUSTED_KEY_ID"

      - name: Verify incident bundle against separately supplied CI trust anchor
        run: |
          result="$(python tools/verify_incident_bundle.py ./real-kill-dpk-proof/incident-bundle --trusted-public-key "$WARRANTKIT_CI_TRUSTED_PUBLIC_KEY_B64")"
          printf '%s\n' "$result"
          case "$result" in
            AUTHENTICATED:*) ;;
            *) echo "Expected AUTHENTICATED result from trusted-key verification" >&2; exit 1 ;;
          esac

      - name: Verify signed cross-artifact bindings
        run: |
          python tools/verify_real_kill_dpk_proof.py \
            --attestation ./real-kill-dpk-proof/dpk-attestation.json \
            --runtime-evidence ./real-kill-dpk-proof/runtime-evidence.json \
            --incident-bundle ./real-kill-dpk-proof/incident-bundle \
            --trusted-key-id "$WARRANTKIT_DPK_TRUSTED_KEY_ID" \
            --trusted-public-key "$WARRANTKIT_CI_TRUSTED_PUBLIC_KEY_B64"

      - name: Upload real-kill incident bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-kill-dpk-proof
          path: real-kill-dpk-proof/
          if-no-files-found: error

  gateway-benchmark-smoke:
    name: Gateway benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install AgentContainment
        run: python -m pip install -e ./AgentContainment

      - name: Install WarrantKit with LangChain integration
        run: python -m pip install -e '.[langchain]'

      - name: Run serial and concurrent gateway benchmark smoke test
        run: python tools/benchmark_gateway_overhead.py --calls 100 --warmup 5 --concurrency 1,2

  toctou-vulnerable-baseline:
    name: TOCTOU reproducer against pre-fix baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check out pre-fix baseline
        run: |
          git fetch --no-tags origin 419c0505ca75f0127ce8c6f515a29f4486e771ce
          git worktree add /tmp/warrantkit-vulnerable-baseline 419c0505ca75f0127ce8c6f515a29f4486e771ce
          git -C /tmp/warrantkit-vulnerable-baseline submodule update --init --recursive
          cp tests/test_toctou_baseline_repro.py /tmp/warrantkit-vulnerable-baseline/tests/test_toctou_baseline_repro.py

      - name: Install dependencies from pre-fix baseline
        working-directory: /tmp/warrantkit-vulnerable-baseline
        run: |
          python -m pip install -e ./AgentContainment
          python -m pip install -e '.[openai-agents,test]'

      - name: Demonstrate the pre-fix check/use gap
        working-directory: /tmp/warrantkit-vulnerable-baseline
        run: python -m pytest -q tests/test_toctou_baseline_repro.py

  agentcontainment-ebpf-hostile-agent:
    name: AgentContainment eBPF hostile-agent proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout WarrantKit and pinned AgentContainment submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify pinned AgentContainment revision
        working-directory: AgentContainment
        run: |
          test "$(git rev-parse HEAD)" = "30af5059e926ff868079f170435b1b7c3b4010d1"
          test -r src/agent_containment/__init__.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install eBPF build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm libbpf-dev pkg-config build-essential dpkg-dev

      - name: Install AgentContainment and WarrantKit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./AgentContainment
          python -m pip install -e '.[test]'

      - name: Verify cgroup-v2 host
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          test -f /sys/fs/cgroup/cgroup.controllers
          id

      - name: Build AgentContainment eBPF programs
        working-directory: AgentContainment
        run: bash scripts/build_ebpf.sh

      - name: Diagnose cgroup delegation proof with visible pytest output
        if: always()
        continue-on-error: true
        working-directory: AgentContainment
        run: |
          sudo env AGENT_CONTAINMENT_RUN_PRIVILEGED_TESTS=1 \
            "$pythonLocation/bin/python" -m pytest -vv -s -ra \
            tests/integration/test_cgroup_delegation.py::test_non_root_process_uses_delegated_cgroup_subtree

      - name: Run privileged hostile-agent proof
        working-directory: AgentContainment
        run: |
          sudo env \
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            AGENT_CONTAINMENT_RUN_PRIVILEGED_TESTS=1 \
            "$pythonLocation/bin/python" demo/hostile_agent_demo.py

      - name: Upload structured hostile-agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentcontainment-hostile-agent-evidence
          path: AgentContainment/hostile-agent-evidence.json
          if-no-files-found: error
          retention-days: 30
