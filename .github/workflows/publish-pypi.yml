name: Publish WarrantKit to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Install and test the built wheel outside the checkout
        run: |
          python -m pip install pytest
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "${WHEEL}[openai-agents]"
          python - <<'PY'
          import importlib.metadata as metadata
          import pathlib
          import tomllib

          expected = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          installed = metadata.version("warrantkit")
          assert installed == expected, (installed, expected)
          extras = metadata.metadata("warrantkit").get_all("Provides-Extra") or []
          assert "openai-agents" in extras, extras
          PY
          TEMP_DIR="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/tests/test_openai_agents_integration.py" "$TEMP_DIR/"
          cd "$TEMP_DIR"
          python -m pytest -q test_openai_agents_integration.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
