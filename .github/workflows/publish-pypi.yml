name: Publish WarrantKit to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Build and publish distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"release tag {actual_tag!r} does not match {expected_tag!r}")
          print(f"Release tag and package version match: {actual_tag}")
          PY

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Install and test the built wheel outside the checkout
        run: |
          python -m pip install pytest
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "${WHEEL}[openai-agents]"
          python - <<'PY'
          import importlib.metadata as metadata
          import pathlib
          import tomllib

          expected = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          installed = metadata.version("warrantkit")
          assert installed == expected, (installed, expected)
          extras = metadata.metadata("warrantkit").get_all("Provides-Extra") or []
          assert "openai-agents" in extras, extras
          PY
          TEMP_DIR="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/tests/test_openai_agents_integration.py" "$TEMP_DIR/"
          cd "$TEMP_DIR"
          python -m pytest -q test_openai_agents_integration.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
