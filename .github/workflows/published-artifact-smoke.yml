name: Published package smoke test

on:
  workflow_run:
    workflows: ["Publish WarrantKit to PyPI"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  published-artifacts:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: PyPI install and authority-boundary proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out proof harness at the publishing revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/warrantkit-published"
          echo "$RUNNER_TEMP/warrantkit-published/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/warrantkit-published/bin/python" -m pip install --upgrade pip

      - name: Install the exact released WarrantKit version
        if: github.event_name == 'workflow_run'
        run: |
          VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "EXPECTED_WARRANTKIT_VERSION=$VERSION" >> "$GITHUB_ENV"
          python -m pip install "warrantkit[langchain]==${VERSION}"

      - name: Install latest published WarrantKit version
        if: github.event_name != 'workflow_run'
        run: python -m pip install "warrantkit[langchain]"

      - name: Record versions and reject workspace imports
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import importlib
          import importlib.metadata
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          installed_warrantkit = importlib.metadata.version("warrantkit")
          expected_warrantkit = os.environ.get("EXPECTED_WARRANTKIT_VERSION")
          if expected_warrantkit and installed_warrantkit != expected_warrantkit:
              raise SystemExit(
                  f"installed WarrantKit {installed_warrantkit} does not match released version {expected_warrantkit}"
              )
          for distribution in ("warrantkit", "agentcontainment", "langchain"):
              print(f"{distribution}=={importlib.metadata.version(distribution)}")

          for module_name in ("agentcontain", "agent_containment"):
              module = importlib.import_module(module_name)
              module_path = Path(module.__file__).resolve()
              print(f"{module_name} imported from {module_path}")
              if module_path.is_relative_to(workspace):
                  raise SystemExit(
                      f"{module_name} unexpectedly imported from checkout, not the installed distribution"
                  )
          PY

      - name: Run published WarrantKit no-root demo
        working-directory: ${{ runner.temp }}
        run: warrantkit demo

      - name: Run framework authority-boundary proof against installed packages
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python "$GITHUB_WORKSPACE/tools/run_authority_boundary_demo.py"
