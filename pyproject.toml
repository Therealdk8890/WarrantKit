[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrantkit"
version = "0.1.1"
description = "Runtime enforcement and proof platform for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Kissel" }]
keywords = ["ai-agents", "agent-security", "agent-containment", "ai-safety", "runtime-security", "policy-enforcement", "cgroups", "ebpf"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
urls = { Repository = "https://github.com/Therealdk8890/WarrantKit", Issues = "https://github.com/Therealdk8890/WarrantKit/issues" }

[project.scripts]
warrantkit = "agentcontain.cli:main"
# Backward-compatible CLI alias. The project-facing command is `warrantkit`.
agentcontain = "agentcontain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcontain*"]

[project.optional-dependencies]
langchain = [
    "langchain>=1.0,<2",
]
attestation = [
    "cryptography>=42",
]
test = [
    "pytest>=7",
    "interleave-test @ git+https://github.com/Therealdk8890/interleave-test.git",
    "warrantkit[attestation]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: host or environment-dependent integration proof",
]
